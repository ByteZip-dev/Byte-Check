[package]
name = "byte-check"
version = "0.1.0"
description = "Byte Check — pre-scan verification for Ocean Anticheat"
authors = ["ByteZip-dev"]
edition = "2021"
rust-version = "1.77"

[features]
# Embed the built frontend into the binary for release builds. `tauri dev`
# disables default features so it loads from the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "byte_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
