name: Build & Release

# Builds Byte Check on native Windows and Linux runners.
# - Pushing a tag like `v0.1.0` builds both and attaches the installers +
#   single-file binaries to a GitHub Release (draft).
# - `workflow_dispatch` builds both and uploads them as workflow artifacts.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
          - platform: "ubuntu-22.04"
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libgtk-3-dev

      - name: npm install
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Byte Check ${{ github.ref_type == 'tag' && github.ref_name || 'dev build' }}"
          releaseBody: |
            Pre-scan verification for Ocean Anticheat.

            **🚀 Portable (no install needed)**
            - **Windows:** `Byte-Check-portable.exe` — download and run, done
            - **Linux:** `Byte-Check-portable` — chmod +x and run

            **Installers**
            - **Windows:** `.msi` / `.exe` (runs elevated via UAC)
            - **Linux:** AppImage (single-file), `.deb`, `.rpm`

            Checks performed: process integrity, overlay & injection sweep, system
            clock sync, screen access permission, Ocean domain access (`anticheat.ac`),
            antivirus mode (Windows), tamper log trace.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Prepare portable binary
        run: |
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cp src-tauri/target/x86_64-pc-windows-msvc/release/byte-check.exe "Byte-Check-portable.exe"
          else
            cp src-tauri/target/release/byte-check "Byte-Check-portable"
          fi

      - name: Upload raw binary to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.platform == 'windows-latest' && 'Byte-Check-portable.exe' || 'Byte-Check-portable' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}